name: Generar Web SUNAT

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# 🔑 PERMISOS EXPLÍCITOS PARA EL TOKEN (CRÍTICO)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ✅ Necesario para crear ramas nuevas

      - name: 🐍 Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install deps
        run: pip install -r requirements.txt

      - name: 🔐 Debug secrets (sin exponer valores)
        run: |
          echo "GOOGLE_CREDENTIALS length: ${#GOOGLE_CREDENTIALS}"
          echo "SHEET_ID: ${SHEET_ID:0:10}..."
          echo "APPS_SCRIPT_URL: ${APPS_SCRIPT_URL:0:20}..."
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}

      - name: 🏗️ Generate index.html
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          python main.py
          echo "=== Archivos en raíz ==="
          ls -la
          echo "=== Verificando index.html ==="
          if [ -f "index.html" ]; then
            echo "✅ index.html existe: $(wc -c < index.html) bytes"
            head -c 200 index.html
            echo "..."
          else
            echo "❌ ERROR: index.html NO fue generado"
            exit 1
          fi

      - name: 🚀 Deploy to GitHub Pages (SIMPLIFICADO)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # ❌ Eliminé: force_orphan, keep_files, user_name, user_email (causan conflictos)
